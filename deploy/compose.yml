# zaweb: no devices, no capabilities, read-only everything.  It reaches the
# drive only through bayd's socket, and the records only to read them.
services:
  zaweb:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: zawiper/zaweb:local
    container_name: zaweb
    restart: unless-stopped
    user: "8460:8460"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: America/New_York
    ports:
      - "8460:8460"
    volumes:
      - /run/zawiper:/run/zawiper
      - /srv/zawiper:/srv/zawiper:ro
    # The second host is direct LAN access until Caddy has the route.
    command: ["-listen", ":8460", "-hosts", "zawiper.example.org,192.0.2.18:8460"]
