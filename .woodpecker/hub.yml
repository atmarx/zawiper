# Za Wiper's lane (spec §8, §11).  Every push that touches zawiper/ gets vet
# and test.  On master, it also builds the hub image and brings the hub
# stack up on hub-host.
#
# The hub only.  bayd and bayd-link never ship from here: a key that can
# install bayd can wipe whatever is in a bay, so bays go out by fleet play
# or by hand (`make bay`), with a person's own sudo.  Nothing in this file
# may build, copy, install or start them.
#
# What it assumes:
#   - an agent labelled host=hub-host, as .woodpecker/deploy.yml does.
#   - the-ark is a trusted repo, so steps may mount host paths.
#     deploy.yml already needs that.
#   - the image is built by hub-host's own Docker (the socket) and never
#     pushed, so no registry and no secrets.
#   - /opt/zawiper/tls holds ca.crt, hub.crt and hub.key (deploy/ca.sh hub),
#     put there by hand.  The deploy refuses without them.
#   - the gateway-stack_gateway network exists, its Caddy container is
#     called caddy, and the zawiper.example.org route points at zaweb:8460.
#
# Woodpecker substitutes dollar-brace variables itself, even in comments, so
# shell variables are written with a doubled dollar sign.
when:
  - event: push
    path:
      include: ['zawiper/**', '.woodpecker/zawiper.yml']

labels:
  host: hub-host

steps:
  test:
    image: golang:1.24-alpine
    environment:
      CGO_ENABLED: "0"
    commands:
      - cd zawiper
      - go vet ./...
      - go test ./...

  build-hub:
    image: docker:cli
    when:
      - branch: master
    commands:
      - "VERSION=$$(sed -n 's/^VERSION *:= *//p' zawiper/Makefile)"
      - "docker build -f zawiper/deploy/Dockerfile --build-arg VERSION=$${VERSION} --build-arg COMMIT=${CI_COMMIT_SHA:0:7} -t zawiper/zaweb:${CI_COMMIT_SHA:0:7} -t zawiper/zaweb:latest zawiper"
      - docker image prune -f >/dev/null || true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  deploy-hub:
    image: docker:cli
    when:
      - branch: master
    commands:
      - "for f in ca.crt hub.crt hub.key; do test -s /opt/zawiper/tls/$${f} || { echo \"No /opt/zawiper/tls/$${f}.  Make it with deploy/ca.sh hub, by hand.\"; exit 1; }; done"
      - mkdir -p /opt/zawiper/data
      - chown 8460:8460 /opt/zawiper/data
      - cp zawiper/deploy/hub/compose.yml /opt/zawiper/compose.yml
      - docker compose -f /opt/zawiper/compose.yml up -d --remove-orphans
      # Running (not restarting), and answering where Caddy will ask.
      - sleep 5
      - "test \"$$(docker inspect -f '{{.State.Status}}' zaweb)\" = running"
      # Caddy's image may have busybox wget and no curl.
      - "docker exec caddy sh -c 'if command -v curl >/dev/null; then curl -sf -o /dev/null -H \"Host: zawiper.example.org\" http://zaweb:8460/healthz; else wget -q -O /dev/null --header \"Host: zawiper.example.org\" http://zaweb:8460/healthz; fi'"
      - echo "zaweb ${CI_COMMIT_SHA:0:7} is up on hub-host"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/zawiper:/opt/zawiper
