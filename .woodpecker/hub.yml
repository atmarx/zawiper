# Za Wiper's hub lane, for Woodpecker (docs/spec.md §8, §11).  Every push
# that touches code gets vet and test.  On master, it also builds the hub
# image and brings the hub up from /opt/zawiper on the hub host.
#
# The hub only.  bayd and bayd-link never ship from here: a key that can
# install bayd can wipe whatever is in a bay, so bays go out by hand
# (`make bay`) or a config-management play, with a person's own sudo.
# Nothing in this file may build, copy, install or start them.
#
# What it assumes (docs/bringup.md):
#   - the agent on the hub host carries the label zawiper=hub.
#   - this repo is trusted in Woodpecker, so steps may mount host paths.
#   - the image is built by the hub host's own Docker (the socket) and
#     never pushed, so no registry and no secrets.
#   - /opt/zawiper/tls holds ca.crt, hub.crt and hub.key (deploy/ca.sh hub),
#     and /opt/zawiper/.env sets ZAWIPER_HOSTNAME, both put there by hand.
#     The deploy refuses without them.
#
# Woodpecker substitutes dollar-brace variables itself, even in comments, so
# shell variables are written with a doubled dollar sign.
when:
  - event: push
    path:
      exclude: ['docs/**', '*.md']

labels:
  zawiper: hub

steps:
  test:
    image: golang:1.24-alpine
    environment:
      CGO_ENABLED: "0"
    commands:
      - go vet ./...
      - go test ./...

  build-hub:
    image: docker:cli
    when:
      - branch: master
    commands:
      - "VERSION=$$(sed -n 's/^VERSION *:= *//p' Makefile)"
      - "docker build -f deploy/Dockerfile --build-arg VERSION=$${VERSION} --build-arg COMMIT=${CI_COMMIT_SHA:0:7} -t zawiper/zaweb:${CI_COMMIT_SHA:0:7} -t zawiper/zaweb:latest ."
      - docker image prune -f >/dev/null || true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  deploy-hub:
    image: docker:cli
    when:
      - branch: master
    commands:
      - "for f in tls/ca.crt tls/hub.crt tls/hub.key .env; do test -s /opt/zawiper/$${f} || { echo \"No /opt/zawiper/$${f}.  See docs/bringup.md.\"; exit 1; }; done"
      - mkdir -p /opt/zawiper/data
      - chown 8460:8460 /opt/zawiper/data
      - cp deploy/hub/compose.yml /opt/zawiper/compose.yml
      # From the directory, so compose reads .env and compose.override.yml.
      - cd /opt/zawiper && docker compose up -d --remove-orphans
      # Running (not restarting), and answering on the page's name.
      - sleep 5
      - "test \"$$(docker inspect -f '{{.State.Status}}' zaweb)\" = running"
      - "H=$$(sed -n 's/^ZAWIPER_HOSTNAME=//p' /opt/zawiper/.env); docker run --rm --network container:zaweb busybox:1.36 wget -q -O /dev/null --header \"Host: $${H}\" http://127.0.0.1:8460/healthz"
      - echo "zaweb ${CI_COMMIT_SHA:0:7} is up"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/zawiper:/opt/zawiper
